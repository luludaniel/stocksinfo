name: Daily Stock Morning Report

on:
  schedule:
    # 22:30 UTC = 07:30 KST (다음날). 06:00 KST는 미국 장 마감 직후라
    # yfinance에 당일 종가가 아직 안 잡힐 위험이 있어 07:30으로 이동.
    - cron: "30 22 * * *"
  workflow_dispatch: # 수동 테스트용

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run morning report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          # Optional — unset is fine, economic_cal.py falls back to a static list.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py

      # checkout is fresh every run, so the SQLite snapshot history (signals.py's
      # valuation-band / analyst-target-trend detection) only survives day to day
      # if it's committed back here — otherwise every run starts from an empty DB.
      - name: Persist snapshot history
        if: always()
        run: |
          if [ -n "$(git status --porcelain stocksinfo.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add stocksinfo.db
            git commit -m "chore: update daily snapshot history"
            git push
          fi
